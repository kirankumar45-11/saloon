{% extends 'base.html' %}

{% block title %}Login | Glamour Salon{% endblock %}

{% block content %}
<section class="py-5 bg-light" style="min-height: 70vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow border-0 p-4 mt-5">
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-right-to-bracket fa-3x text-warning mb-3"></i>
                        <h2 class="fw-bold">Welcome Back</h2>
                        <p class="text-muted">Login to manage your appointments</p>
                    </div>
                    
                    <form method="post" action="{% url 'login' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_username" class="form-label fw-bold">Username</label>
                            <input type="text" name="username" id="id_username" class="form-control" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="id_password" class="form-label fw-bold">Password</label>
                            <input type="password" name="password" id="id_password" class="form-control" required>
                        </div>
                        {% if form.errors %}
                            <div class="alert alert-danger p-2 mb-3">
                                Invalid username or password.
                            </div>
                        {% endif %}
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">Login</button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p>Don't have an account? <a href="{% url 'register' %}" class="text-warning fw-bold text-decoration-none">Sign up</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
