{% extends 'base.html' %}
{% block title %}Book Appointment | Glamour Salon{% endblock %}
{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card p-4 p-md-5">
                    <h2 class="section-title mb-4">Book Your Appointment</h2>
                    <form method="post" id="booking_form">
                        {% csrf_token %}

                        <!-- Category (not a model field – drives JS) -->
                        <div class="mb-3">
                            <label for="category_select" class="form-label fw-bold">Service Category</label>
                            <select id="category_select" class="form-select" required>
                                <option value="">Select a category…</option>
                                {% for cat in categories %}
                                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Service (populated by JS) -->
                        <div class="mb-3">
                            <label for="id_service" class="form-label fw-bold">Specific Service</label>
                            <select name="service" id="id_service" class="form-select" required disabled>
                                <option value="">Select a service…</option>
                            </select>
                        </div>

                        <!-- Expert -->
                        <div class="mb-3">
                            <label for="id_expert" class="form-label fw-bold">Select Expert</label>
                            {{ form.expert }}
                        </div>

                        <!-- Date & Time -->
                        <div class="row">
                            <div class="col-md-12 mb-3">
                                <label for="id_date" class="form-label fw-bold">Select Date</label>
                                {{ form.date }}
                            </div>
                        </div>

                        <!-- Time Slot Selection -->
                        <div class="mb-4">
                            <label class="form-label fw-bold d-block">Available Time Slots</label>
                            <div id="slots_container" class="slots-grid">
                                <p class="text-muted small italic">Please select a date to see available seats.</p>
                            </div>
                            {{ form.time }}
                            <div id="selected_time_display" class="mt-2 small fw-bold text-gold"></div>
                        </div>

                        <!-- Availability info (Legacy, can keep or remove) -->
                        <div id="booked_times" class="mb-3 small d-none"></div>

                        <!-- Notes -->
                        <div class="mb-3">
                            <label for="id_notes" class="form-label fw-bold">Notes <span class="text-muted">(optional)</span></label>
                            {{ form.notes }}
                        </div>

                        <div class="d-grid mt-3">
                            <button class="btn btn-gold btn-lg">Confirm Booking</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
